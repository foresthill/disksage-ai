[package]
name = "disksage-engine"
version = "0.0.1"
edition = "2021"
description = "Cross-platform DiskSage engine (PoC). Reimplements the bash CLI's logic in Rust so it can run natively on macOS, Windows and Linux."
license = "Apache-2.0"

[[bin]]
name = "disksage-engine"
path = "src/main.rs"

[dependencies]
# Cross-platform disk enumeration (total/available space per mount) — the whole
# point of the Rust port: one code path for macOS, Windows and Linux.
sysinfo = "0.32"
# Minimal pure-Rust HTTP server for the in-process `serve` UI (no TLS, no system
# deps) — the path to replacing the macOS-only bash `serve`.
tiny_http = "0.12"
# Local timestamps for saved report filenames (cross-platform; `date` shell-out
# isn't portable to Windows).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
