name: Desktop

# Builds the DiskSage desktop app (Tauri v2) for macOS, Linux and Windows.
#   - push a tag `v*`  → create ONE draft Release, then each OS uploads its
#     installer to it. (create-release runs first so the three OS build jobs
#     don't race to create the Release — that race split v0.1.4 across two.)
#   - manual "Run workflow" → builds only, uploads each OS's bundle as an artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Create the (single) draft Release up front on a tag, so the matrix build jobs
  # upload to one known release id instead of each trying to create their own.
  create-release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `DiskSage ${tag}`,
              body: 'DiskSage desktop app.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    # Run after create-release on tags, and also on manual dispatch (where
    # create-release is skipped — a skipped dependency would otherwise skip this).
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # → .dmg / .app (universal)
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-latest # → .deb / .AppImage
            rust_targets: ""
            args: ""
          - platform: windows-latest # → .msi / .exe (NSIS)
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action uploads assets to the Release on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri v2's Linux prerequisites (webkit2gtk 4.1, not 4.0).
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install

      - name: Build (upload to the release on tags)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          # Upload to the release created above (empty on dispatch → build only).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload bundle artifact (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: disksage-${{ matrix.platform }}
          path: desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn
