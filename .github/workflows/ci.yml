name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n disksage

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck (severity=warning)
        run: shellcheck --severity=warning disksage

  # The Rust engine (engine/) is otherwise only compiled by the tag/dispatch
  # Desktop workflow, so a PR could break its build, formatting, clippy or tests
  # unnoticed. This gates every PR on Linux.
  engine:
    name: Rust engine (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (release)
        run: cargo test --release
