[package]
name = "desktop"
version = "0.1.11"
description = "DiskSage desktop shell — native window over `disksage serve`"
authors = ["DiskSage"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Start-at-login toggle for the menu-bar-resident app (opt-in via the tray menu).
tauri-plugin-autostart = "2"
# In-app auto-update: check GitHub for a newer release, download and install it.
# Desktop-only (no mobile targets here). The update's own signature is verified
# with the updater key (separate from Apple/OS code signing).
tauri-plugin-updater = "2"
# Native confirm/alert dialogs for the "update available / up to date" prompts
# driven from the tray (the served UI is cross-origin and can't call Tauri APIs).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The DiskSage engine, called in-process for disk stats (no subprocess). Sharing
# the same crate keeps the tray's numbers identical to the CLI and is the basis
# for eventually dropping the bash `serve` dependency.
disksage-engine = { path = "../../engine" }

